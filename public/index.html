<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="vr-mode" content="3d-sbs">
  <meta name="projection" content="sbs">
  <meta name="stereo" content="sbs_left_right">
  <title>Quest 3D 沉浸影院 - 2D转3D 视频流转换服务</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
  <div id="app-root">
    <!-- 1. 顶部导览与链接输入控制面板 -->
    <header class="app-header">
      <div class="logo-area">
        <span class="logo-icon">🥽</span>
        <h1>Quest 3D 沉浸影院 <span>2D转3D 实时流服务</span></h1>
      </div>
      <div class="url-control-card">
        <div class="input-row">
          <input type="url" id="video-input" placeholder="输入任意视频播放链接 (.m3u8 / .mp4 / 直播流)..." autocomplete="off" />
          <button id="btn-play" onclick="handleStartPlayback()">▶ 播放</button>
        </div>
        <div class="preset-row">
          <span class="preset-label">预置 3D 试听:</span>
          <button class="chip-btn" onclick="loadPreset('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">🎬 Mux HLS 示例</button>
          <button class="chip-btn" onclick="loadPreset('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')">🐰 Big Buck Bunny MP4</button>
        </div>
      </div>
    </header>

    <!-- 2. 视频与 WebGL 视差处理画布容器 -->
    <main id="player-viewport">
      <!-- 原始 2D 视频输入源 (隐式播放) -->
      <video id="source-video" playsinline crossorigin="anonymous"></video>

      <!-- WebGL 2D转3D 视差深度处理器 (隐式渲染) -->
      <canvas id="gl-canvas" width="1920" height="1080" data-stereo-mode="sbs" data-projection="3d_sbs"></canvas>

      <!-- 实时捕获输出的 3D 立体 HTML5 视频元素 (固定铺满视口，视频绝对不动) -->
      <video id="converted-3d-video" playsinline crossorigin="anonymous" data-stereo-mode="sbs" data-projection="3d_sbs"></video>

      <!-- 初始引导遮罩 -->
      <div id="start-guide-mask">
        <div class="play-pulse-circle" onclick="handleStartPlayback()">▶</div>
        <h2>输入视频链接并点击“播放”</h2>
        <p>点击“播放”立即输出 3D 视差视频流，使用底部可自由拖动的 3D 专属控制条！</p>
      </div>

      <!-- 专属 3D 视频控制条 (固定置底，可平滑拖动进度条，视频绝对静止) -->
      <div id="custom-control-bar" class="custom-player-bar">
        <button id="btn-toggle-play" class="control-btn" onclick="togglePlayPause()">▶</button>
        <span id="time-display" class="time-text">00:00 / 00:00</span>

        <!-- 可自由平滑拖动的 Seek 进度条 -->
        <div class="seek-container">
          <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1" oninput="onSeekInput(this.value)" onchange="onSeekChange(this.value)">
          <div id="seek-progress-fill" class="seek-fill"></div>
        </div>

        <div class="parallax-control">
          <label for="parallax-range">3D 视差:</label>
          <input type="range" id="parallax-range" min="5" max="90" value="35" oninput="onParallaxSliderChange(this.value)">
          <span id="parallax-val">35</span>
        </div>

        <button class="control-btn icon-btn" onclick="toggleFullscreen()" title="全屏">📺</button>
      </div>
    </main>

    <!-- Toast 提示框 -->
    <div id="toast" class="toast-card">已载入视频流，正在生成 3D 视差...</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
